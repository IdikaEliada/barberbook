{% extends "appointments/base.html" %}
{% block title %}BarberBook — Home{% endblock %}
{% block content %}
<div class="hero">
  <h1>BarberBook</h1>
  <p>Book your next haircut in seconds.</p>
  {% if user.is_authenticated %}
    <a href="{% url 'book_appointment' %}" class="btn">Book an Appointment</a>
  {% else %}
    <a href="{% url 'register' %}" class="btn">Get Started</a>
  {% endif %}
</div>
{% endblock %}
